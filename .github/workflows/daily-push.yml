name: 公众号头条每日推送

on:
  schedule:
    # 北京时间每晚 22:00 (UTC 14:00)
    - cron: '0 14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行推送脚本
        env:
          WEREAD_TOKEN: ${{ secrets.WEREAD_TOKEN }}
          WEREAD_VID: ${{ secrets.WEREAD_VID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node cloud_push_v2.js
